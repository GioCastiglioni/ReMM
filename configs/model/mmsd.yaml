name: MMSD

model:
  _target_: pl_modules.mmsd.MMSD
  encoder:
    _target_: models.mmfusion.MMFusion
    embed_dim: ${oc.select:embed_dim,512}
    fusion: "concat"    # 'x-attn' does not construct in this repo
    pool: "cls"
    n_heads: 8
    n_layers: 1
    add_bias_kv: False
    dropout: 0

  projection:
    _target_: pl_modules.mmsd.MMSD._build_mlp
    in_dim: ${model.model.encoder.embed_dim}
    mlp_dim: 512
    out_dim: 256

  loss_kwargs:
    objective: "dino"              # 'dino' | 'byol'
    weights: null                  # per-mask weights; null = uniform
    # dino only
    student_temp: 0.1
    teacher_temp: 0.07
    warmup_teacher_temp: 0.04
    warmup_teacher_temp_frac: 0.3
    center_momentum: 0.9
    out_dim: 2048                  # prototypes; shrink for narrow embeddings

  ema_base: 0.996
  ema_final: 1.0

  # Self-distillation schedules; the WoMM cells have none of these.
  lr_warmup_frac: 0.1
  wd_mult_end: 10.0                # multiplies optim.weight_decay; dino only, since
                                   # BYOL's paper specifies a constant decay
  freeze_last_layer_epochs: 1      # dino only

  # Keys differ per objective, so setting one needs Hydra's append form:
  #   +model.model.predictor_kwargs.hidden_dim=1024
  predictor_kwargs: {}

  cross_view: null                 # null = each objective's own default
  # true: the teacher also encodes the unimodal masks and the joint student predicts
  # them, so each unimodal-joint pair runs in both directions as in CoMM
  bidirectional: false
  # false (with bidirectional: true) drops the unimodal student's predictions of the joint
  # teacher, the direction a unimodal branch cannot satisfy
  unimodal_to_joint: true
